services:
  app: 
    image: ayomeer/cv-devcontainer-image:latest
    container_name: devcontainer
    command: sh
    network_mode: host 

    volumes:
      - .:/app

    environment:
      - DISPLAY=$DISPLAY # set display environment to host display
      - MPLBACKEND=TkAgg # set matplotlib backend 
      
    stdin_open: true
    tty: true
